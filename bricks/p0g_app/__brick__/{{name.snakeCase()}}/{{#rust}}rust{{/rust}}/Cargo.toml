[package]
name = "{{name.snakeCase()}}_native"
version = "0.1.0"
edition = "2021"
publish = false

# A library only: the app's Dart CLI is its one command line, and it calls
# this crate through frb. Never add a [[bin]] target.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The version at frb 848e438, the commit core/pubspec.yaml pins. tool/rust.sh
# patches it (rust/.cargo/config.toml) to flutter_p0g's patched frb, or to
# that commit when the patched one is not built.
flutter_rust_bridge = { version = "=2.14.0-beta.2", default-features = false, features = [
    # frb's defaults without thread-pool: single-threaded wasm (no COOP/COEP).
    "anyhow", "dart-opaque", "log", "portable-atomic", "rust-async", "user-utils", "wasm-start",
] }
sha2 = "0.10"
