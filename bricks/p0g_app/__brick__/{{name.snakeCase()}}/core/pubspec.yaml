name: {{name.snakeCase()}}_core
description: The logic of {{name.snakeCase()}}. Pure Dart (no package:flutter); runs in the app, its workers and the CLI.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0
  logging: ^1.3.0
  squadron: ^7.4.4
  web: ^1.1.0
  squadron_process:
    git:
      url: https://github.com/p0g-stack/squadron_process
      ref: d6c561bc60a72556fc6fa83bb90871fe8c978a4e
  flutter_webui_client:
    git:
      url: https://github.com/p0g-stack/flutter-webui
      path: packages/flutter_webui_client
      ref: 020ab92d7b75bb6882f86afbe35b18961340bd7f
{{#rust}}  crypto: ^3.0.6
  # frb at flutter_p0g's base commit (master after 2.14.0-beta.2): the
  # bindings its codegen writes need it. tool/rust.sh overrides it with
  # flutter_p0g's patched copy when that is built.
  flutter_rust_bridge:
    git:
      url: https://github.com/fzyzcjy/flutter_rust_bridge
      path: frb_dart
      ref: 848e438c561491adcc16cbf8b33bb61e541bd475
{{/rust}}
dev_dependencies:
  build_runner: ^2.16.1
  lints: ^6.1.0
  squadron_builder: ^9.3.2
  test: ^1.31.1
