name: p0g_app
description: A p0g-stack app as a pub workspace - pure Dart core, Flutter app and Dart CLI, wired for Squadron places, strategies and logging.
version: 0.6.3
repository: https://github.com/p0g-stack/bricks/tree/main/bricks/p0g_app

environment:
  mason: ^0.1.1

vars:
  name:
    type: string
    description: The app name, used as the package prefix and the CLI executable name.
    default: my_app
    prompt: What is the app called?
  description:
    type: string
    description: One line describing the app.
    default: A p0g-stack app.
    prompt: Describe the app in one line.
  org:
    type: string
    description: Reverse-domain organization, passed to flutter create for platform folders.
    default: com.example
    prompt: What is the organization (reverse domain)?
  rust:
    type: boolean
    description: Add a Rust crate bound through flutter_rust_bridge (FFI only).
    default: false
    prompt: Add a Rust crate through flutter_rust_bridge?
