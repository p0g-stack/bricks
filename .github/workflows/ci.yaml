name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bricks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      # frb codegen at flutter_p0g's base commit, which the rust variant pins.
      - uses: actions/cache@v4
        id: frb
        with:
          path: ~/.frb-codegen
          key: frb-codegen-848e438c561491adcc16cbf8b33bb61e541bd475
      - name: frb codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: >
          cargo install --locked --root ~/.frb-codegen
          --git https://github.com/fzyzcjy/flutter_rust_bridge
          --rev 848e438c561491adcc16cbf8b33bb61e541bd475
          flutter_rust_bridge_codegen
      - run: echo "$HOME/.frb-codegen/bin" >> "$GITHUB_PATH"
      - name: Install mason
        run: |
          dart pub global activate mason_cli 0.1.4
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate and test
        run: tool/ci.sh "$RUNNER_TEMP/bricks"
